name: realty-compare

services:
  db:
    image: postgres:16-alpine
    container_name: realty-db
    restart: unless-stopped
    mem_limit: 96m
    environment:
      POSTGRES_DB: imoveis
      # O init.sql faz GRANT para o papel "user". O nome precisa ser esse.
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d imoveis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgrest:
    image: postgrest/postgrest:v16.4
    container_name: realty-postgrest
    restart: unless-stopped
    mem_limit: 48m
    environment:
      PGRST_DB_URI: postgres://user:${POSTGRES_PASSWORD}@db:5432/imoveis
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${AUTH_SECRET}
      PGRST_DB_POOL: "2"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: realty-compare-web:latest
    container_name: realty-web
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    environment:
      NODE_ENV: production
      PORT: "8080"
      POSTGREST_URL: http://postgrest:3000
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD}@db:5432/imoveis
      AUTH_EMAIL: ${AUTH_EMAIL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      NODE_OPTIONS: --max-old-space-size=96
      TZ: America/Sao_Paulo
    depends_on:
      - postgrest
    security_opt:
      - no-new-privileges:true
    networks:
      internal: {}
      vps:
        aliases:
          - realty-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
  vps:
    external: true
    name: vps-mini_default

volumes:
  pgdata:
